name: Android internal release

on:
  push:
    branches: [main]
    paths:
      - "DroidQuest-Android/**"
      - "data/content/**"
      - ".github/workflows/android-internal-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-internal-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, bundle, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: DroidQuest-Android

    env:
      DROIDQUEST_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      DROIDQUEST_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      DROIDQUEST_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$DROIDQUEST_UPLOAD_STORE_PASSWORD" || { echo "Missing ANDROID_UPLOAD_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$DROIDQUEST_UPLOAD_KEY_ALIAS" || { echo "Missing ANDROID_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "$DROIDQUEST_UPLOAD_KEY_PASSWORD" || { echo "Missing ANDROID_UPLOAD_KEY_PASSWORD"; exit 1; }
          test -n "$PLAY_SERVICE_ACCOUNT" || { echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/droidquest-upload.jks"
          chmod 600 "$RUNNER_TEMP/droidquest-upload.jks"

      - name: Test, lint, and build signed bundle
        env:
          DROIDQUEST_UPLOAD_STORE_FILE: ${{ runner.temp }}/droidquest-upload.jks
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:bundleRelease \
            -PciVersionCode="$VERSION_CODE" \
            -PciVersionName="0.3.0-internal.$GITHUB_RUN_NUMBER"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidquest-internal-${{ github.run_number }}
          path: DroidQuest-Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.novanest.droidquest
          releaseFiles: DroidQuest-Android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
