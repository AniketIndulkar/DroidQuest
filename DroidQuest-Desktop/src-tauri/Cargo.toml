[package]
name = "droidquest-desktop"
version = "0.1.0"
description = "DroidQuest desktop learning application"
authors = ["DroidQuest"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "droidquest_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
